plugins {
    id 'base'
    id 'java-base'
}

version = mod_version
group = mod_group_id

// Each loader retains its supported Gradle version and runs in its own JVM.
def targets = [
        NeoForge: [directory: 'neoforge-1.21.1', java: 21, suffix: '1.21.1-neoforge'],
        Forge: [directory: 'forge-1.20.1', java: 17, suffix: '1.20.1-forge']
]
def orderedTasks = []
def buildTasks = []
def gameTestTasks = []
targets.each { name, target ->
    def launcher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(target.java) }
    [build: 'build', test: 'runGameTestServer'].each { action, childTask ->
        def previousTasks = orderedTasks.toList()
        def task = tasks.register("${action}${name}", Exec) {
            group = action == 'build' ? 'build' : 'verification'
            description = "Runs ${childTask} for ${target.directory}."
            workingDir target.directory
            mustRunAfter previousTasks
            if (action == 'test') dependsOn "build${name}"
            doFirst {
                def windows = System.getProperty('os.name').toLowerCase().contains('windows')
                def arguments = [childTask, '--console=plain', '--max-workers=2']
                if (providers.gradleProperty('withoutMineColonies').isPresent()) arguments.add('-PwithoutMineColonies')
                if (providers.gradleProperty('modLogLevel').isPresent()) arguments.add("-PmodLogLevel=${providers.gradleProperty('modLogLevel').get()}")
                arguments.add("--warning-mode=${gradle.startParameter.warningMode.name().toLowerCase(Locale.ROOT)}")
                if (gradle.startParameter.offline) arguments.add('--offline')
                if (gradle.startParameter.refreshDependencies) arguments.add('--refresh-dependencies')
                if (!gradle.startParameter.buildCacheEnabled) arguments.add('--no-build-cache')
                environment 'JAVA_HOME', launcher.get().metadata.installationPath.asFile.absolutePath
                commandLine(windows ? ['cmd', '/c', 'gradlew.bat'] + arguments : ['sh', './gradlew'] + arguments)
            }
        }
        orderedTasks.add(task)
        (action == 'build' ? buildTasks : gameTestTasks).add(task)
    }
}

tasks.register('collectJars', Sync) {
    group = 'build'
    description = 'Collects the two production mod jars in build/libs.'
    dependsOn buildTasks
    into layout.buildDirectory.dir('libs')
    targets.values().each { target ->
        from("${target.directory}/build/libs") {
            include "${mod_id}-${mod_version}-${target.suffix}.jar"
        }
    }
}

tasks.register('runGameTestServer') {
    group = 'verification'
    description = 'Runs GameTests for both Minecraft editions.'
    dependsOn gameTestTasks
}
tasks.register('test') {
    group = 'verification'
    dependsOn 'runGameTestServer'
}
tasks.named('assemble') { dependsOn 'collectJars' }

def descriptionKeys = [
        'fml.menu.mods.info.description.safepaths',
        'neoforge.screen.mods.info.description.safepaths',
        'modmenu.descriptionTranslation.safepaths'
]

tasks.register('verifyDescriptions') {
    group = 'verification'
    description = 'Checks project introductions and translated description aliases against their shared sources.'
    doLast {
        if (!mod_description || mod_description.length() > 250) {
            throw new GradleException('mod_description must contain 1–250 characters')
        }
        def introductions = [
                'README.md': ~(/(<\/p>\r?\n\r?\n)([^\r\n]+)(?=\r?\n)/),
                'wiki/Home.md': ~(/(^# [^\r\n]+\r?\n\r?\n)([^\r\n]+)(?=\r?\n)/)
        ]
        introductions.each { path, pattern ->
            def intro = pattern.matcher(file(path).getText('UTF-8'))
            if (!intro.find() || intro.group(2) != mod_description) {
                throw new GradleException("${path} introduction differs from mod_description; run node .github/scripts/sync-descriptions.mjs --write")
            }
        }
        fileTree('common/src/main/resources/assets/safepaths/lang').matching { include '*.json' }.each { language ->
            def values = new groovy.json.JsonSlurper().parse(language, 'UTF-8')
            def canonical = language.name == 'en_us.json' ? mod_description : values[descriptionKeys.first()]
            if (!(canonical instanceof String) || canonical.isBlank() || descriptionKeys.any { values[it] != canonical }) {
                throw new GradleException("Inconsistent description aliases in ${language.name}")
            }
        }
        logger.lifecycle('Verified shared project descriptions')
    }
}

tasks.register('verifyJars') {
    group = 'verification'
    description = 'Checks the production jars contain the correct loader, bytecode, and shared resources.'
    dependsOn 'collectJars', 'verifyDescriptions'
    doLast {
        targets.each { name, target ->
            def artifact = layout.buildDirectory.file("libs/${mod_id}-${mod_version}-${target.suffix}.jar").get().asFile
            new java.util.zip.ZipFile(artifact).withCloseable { zip ->
                def neo = name == 'NeoForge'
                def required = [
                        "META-INF/${neo ? 'neoforge.mods.toml' : 'mods.toml'}",
                        "data/safepaths/${neo ? 'structure' : 'structures'}/platform.nbt",
                        "data/safepaths/tags/${neo ? 'block' : 'blocks'}/can_become_path.json",
                        "data/safepaths/tags/${neo ? 'block' : 'blocks'}/cannot_become_path.json",
                        "data/safepaths/tags/${neo ? 'block' : 'blocks'}/is_path.json",
                        "data/safepaths/tags/${neo ? 'entity_type' : 'entity_types'}/path_creators.json",
                        "data/safepaths/tags/${neo ? 'entity_type' : 'entity_types'}/path_blocked.json",
                        'icon.png',
                        'com/ahmetakif/safepaths/PathCreationEvent.class',
                        'com/ahmetakif/safepaths/PathMemorySavedData.class',
                        'com/ahmetakif/safepaths/PathEvents.class',
                        'com/ahmetakif/safepaths/compat/MineColoniesProtection.class'
                ]
                ['de_de', 'en_us', 'es_es', 'fr_fr', 'ja_jp', 'pt_br', 'ru_ru', 'tr_tr', 'zh_cn'].each {
                    required.add("assets/safepaths/lang/${it}.json")
                }
                required.each { entry ->
                    if (zip.getEntry(entry) == null) throw new GradleException("${artifact.name} is missing ${entry}")
                }
                def wrongMetadata = "META-INF/${neo ? 'mods.toml' : 'neoforge.mods.toml'}"
                if (zip.getEntry(wrongMetadata) != null) throw new GradleException("Wrong loader metadata in ${artifact.name}")
                def metadata = zip.getInputStream(zip.getEntry(required.first())).withCloseable { it.getText('UTF-8') }
                if (metadata.contains('${')) throw new GradleException("Unexpanded metadata in ${artifact.name}")
                if (!(metadata =~ /(?m)^version\s*=\s*"${java.util.regex.Pattern.quote(mod_version)}"\s*$/).find()) {
                    throw new GradleException("Wrong mod version in ${artifact.name}")
                }
                if (!metadata.contains('description="' + mod_description + '"')) {
                    throw new GradleException("Wrong project description in ${artifact.name}")
                }
                ['de_de', 'en_us', 'es_es', 'fr_fr', 'ja_jp', 'pt_br', 'ru_ru', 'tr_tr', 'zh_cn'].each { language ->
                    def path = "assets/safepaths/lang/${language}.json"
                    def source = new groovy.json.JsonSlurper().parse(file("common/src/main/resources/${path}"), 'UTF-8')
                    def packaged = zip.getInputStream(zip.getEntry(path)).withCloseable {
                        new groovy.json.JsonSlurper().parseText(it.getText('UTF-8'))
                    }
                    if (descriptionKeys.any { packaged[it] != source[descriptionKeys.first()] }) {
                        throw new GradleException("Wrong ${language} description in ${artifact.name}")
                    }
                }
                if (!neo && !metadata.contains('displayTest="IGNORE_SERVER_VERSION"')) {
                    throw new GradleException("Forge client compatibility must be optional in ${artifact.name}")
                }
                zip.entries().each { entry ->
                    if (entry.name.endsWith('.class')) {
                        def major = zip.getInputStream(entry).withCloseable { stream ->
                            def input = new DataInputStream(stream)
                            input.readInt()
                            input.readUnsignedShort()
                            input.readUnsignedShort()
                        }
                        if (major != (neo ? 65 : 61)) throw new GradleException("Wrong Java bytecode in ${artifact.name}: ${entry.name}")
                    }
                }
                logger.lifecycle("Verified ${artifact.name}")
            }
        }
    }
}
tasks.named('check') { dependsOn 'verifyJars' }

// Edition wrappers own their build directories; root clean removes collected jars.
tasks.named('clean', Delete) {
    setDelete([layout.buildDirectory.dir('libs')])
}
