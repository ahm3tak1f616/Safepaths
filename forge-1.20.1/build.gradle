plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
}

apply from: '../gradle/mod-properties.gradle'

version = "${mod_version}-1.20.1-forge"
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'parchment', version: "${parchment_mappings_version}-${parchment_minecraft_version}"

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            workingDirectory project.file(providers.gradleProperty('withoutMineColonies').isPresent()
                    ? 'run/forgeGameTestServerWithoutMineColonies' : 'run/forgeGameTestServer')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

repositories {
    maven {
        url "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly fg.deobf("curse.maven:minecolonies-${minecolonies_project_id}:${minecolonies_file_id}")
    compileOnly fg.deobf("curse.maven:structurize-${structurize_project_id}:${structurize_file_id}")
    compileOnly fg.deobf("curse.maven:multi-piston-${multipiston_project_id}:${multipiston_file_id}")
    compileOnly fg.deobf("curse.maven:blockui-${blockui_project_id}:${blockui_file_id}")
    compileOnly fg.deobf("curse.maven:domum-ornamentum-${domum_ornamentum_project_id}:${domum_ornamentum_file_id}")

    if (!providers.gradleProperty('withoutMineColonies').isPresent()) {
        runtimeOnly fg.deobf("curse.maven:minecolonies-${minecolonies_project_id}:${minecolonies_file_id}")
        runtimeOnly fg.deobf("curse.maven:structurize-${structurize_project_id}:${structurize_file_id}")
        runtimeOnly fg.deobf("curse.maven:multi-piston-${multipiston_project_id}:${multipiston_file_id}")
        runtimeOnly fg.deobf("curse.maven:blockui-${blockui_project_id}:${blockui_file_id}")
        runtimeOnly fg.deobf("curse.maven:domum-ornamentum-${domum_ornamentum_project_id}:${domum_ornamentum_file_id}")
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : 'ahmetakif',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : 'ahmetakif',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.register('ideBeforeRun') {
    dependsOn 'classes'
}

sourceSets.main.java.srcDir '../common/src/main/java'
sourceSets.main.resources.srcDir '../common/src/main/resources'

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.FAIL
    includeEmptyDirs = false
    eachFile { details ->
        details.path = details.path.replace('tags/block/', 'tags/blocks/')
                .replace('tags/entity_type/', 'tags/entity_types/')
                .replace('/structure/', '/structures/')
    }
}
