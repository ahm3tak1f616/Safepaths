name: Set up both Minecraft toolchains
description: Install Java 17 and 21 and prepare Gradle for the two edition builds.
runs:
  using: composite
  steps:
    - name: Set up Java 17 and 21
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: |
          17
          21
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6.4.0
      with:
        gradle-home-cache-excludes: |
          caches/ng_execute
          caches/build-cache-1
    - name: Discard cached paths from earlier source layouts
      shell: bash
      run: |
        rm -rf -- "${GRADLE_USER_HOME:-$HOME/.gradle}/caches/ng_execute"
