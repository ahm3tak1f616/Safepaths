name: Publish both editions
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build-editions.yml
    with:
      release-tag: ${{ github.event.release.tag_name }}
  modrinth:
    needs: build
    uses: ./.github/workflows/publish-modrinth.yml
    with:
      mod-version: ${{ needs.build.outputs.mod-version }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      release-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
      changelog: ${{ github.event.release.body }}
    secrets:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
  curseforge:
    needs: build
    uses: ./.github/workflows/publish-curseforge.yml
    with:
      mod-version: ${{ needs.build.outputs.mod-version }}
      artifact-name: ${{ needs.build.outputs.artifact-name }}
      release-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
      changelog: ${{ github.event.release.body }}
    secrets:
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
  github:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: build/libs
      - name: Attach both tested jars to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" build/libs/*.jar --repo "$GITHUB_REPOSITORY" --clobber
  project-page:
    needs: [modrinth, curseforge, github]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: modrinth-project-page
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sync the released project page
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT_REF: ${{ github.event.release.tag_name }}
        run: node .github/scripts/sync-modrinth.mjs
