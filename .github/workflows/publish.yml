name: Publish to GitHub, Modrinth and CurseForge

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')
          if [ -z "$VERSION" ] || [ "$RELEASE_TAG" != "v${VERSION}-1.20.1-forge" ]; then
            echo "Release tag does not match this branch's mod version." >&2
            exit 1
          fi
          echo "MOD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.4.0

      - name: Build and test with MineColonies
        run: ./gradlew build runGameTestServer --console=plain

      - name: Test without MineColonies
        run: ./gradlew runGameTestServer -PwithoutMineColonies --console=plain

      - name: Publish tested JAR
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ github.event.release.tag_name }}
          modrinth-id: ec6ewft2
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: '1600734'
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: build/libs/safepaths-${{ env.MOD_VERSION }}-1.20.1-forge.jar
          name: ${{ github.event.release.name }}
          version: ${{ env.MOD_VERSION }}
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          changelog: ${{ github.event.release.body }}
          loaders: forge
          game-versions: '1.20.1'
          java: '17'
          dependencies: |
            minecolonies(optional){modrinth:sSr0QEGx}{curseforge:245506}
