name: Dependency submission
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependencies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: forge-1.20.1
            loader: forge
            java: '17'
          - directory: neoforge-1.21.1
            loader: neoforge
            java: '21'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Submit edition dependencies
        id: snapshot
        uses: gradle/actions/dependency-submission@v6.4.0
        with:
          build-root-directory: ${{ matrix.directory }}
          additional-arguments: --no-configuration-cache --no-build-cache --max-workers=2
          gradle-home-cache-excludes: |
            caches/ng_execute
            caches/build-cache-1
      - name: Check edition coverage
        env:
          SNAPSHOT_FILE: ${{ steps.snapshot.outputs.dependency-graph-file }}
          EDITION_DIRECTORY: ${{ matrix.directory }}
          EDITION_LOADER: ${{ matrix.loader }}
        run: node .github/scripts/check-dependency-graph.mjs
