name: Build
on:
  push:
    branches: [main, shared-multiversion]
  pull_request:
    branches: [main, shared-multiversion]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    uses: ./.github/workflows/build-editions.yml
