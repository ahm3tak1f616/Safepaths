name: SafePaths CodeQL Scan
on:
  push:
    branches: [main, shared-multiversion]
  pull_request:
    branches: [main, shared-multiversion]
permissions:
  contents: read
concurrency:
  group: codeql-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  analyze:
    name: Scan both editions
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
      - name: Start CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          queries: security-extended
      - name: Compile both editions for analysis
        run: ./gradlew assemble --no-build-cache --console=plain
      - name: Complete the scan
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
