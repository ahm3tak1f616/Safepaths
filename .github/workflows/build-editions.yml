name: Build and test both editions
on:
  workflow_call:
    inputs:
      release-tag:
        type: string
        default: ''
    outputs:
      mod-version:
        value: ${{ jobs.editions.outputs.mod-version }}
      artifact-name:
        value: ${{ jobs.editions.outputs.artifact-name }}
permissions:
  contents: read
jobs:
  editions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      mod-version: ${{ steps.metadata.outputs.mod-version }}
      artifact-name: ${{ steps.metadata.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate build and release metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: node .github/scripts/release-metadata.mjs
      - name: Validate the Modrinth project page
        run: node .github/scripts/sync-modrinth.mjs --check
      - uses: ./.github/actions/setup-build
      - name: Build and test both editions with MineColonies
        run: ./gradlew build --no-build-cache --console=plain
      - name: Test both editions without MineColonies
        run: ./gradlew runGameTestServer -PwithoutMineColonies --no-build-cache --console=plain
      - name: Store tested production jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.artifact-name }}
          path: |
            build/libs/safepaths-${{ steps.metadata.outputs.mod-version }}-1.20.1-forge.jar
            build/libs/safepaths-${{ steps.metadata.outputs.mod-version }}-1.21.1-neoforge.jar
          if-no-files-found: error
          retention-days: 14
