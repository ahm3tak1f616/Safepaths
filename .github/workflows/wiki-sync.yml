name: Sync Wiki to GitHub Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki-sync.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to GitHub Wiki
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          WIKI_REPO_URL="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.wiki.git"

          echo "===> Checking out GitHub Wiki repository..."
          if git clone "$WIKI_REPO_URL" wiki_clone; then
            echo "===> Wiki repository cloned successfully."
            cd wiki_clone

            # Remove existing wiki content except git metadata
            find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

            # Copy all markdown wiki files (excluding internal wiki README if desired, but including all pages)
            cp ../wiki/*.md .

            git add -A
            if git diff-index --quiet HEAD; then
              echo "===> No wiki changes to commit. Up to date!"
            else
              git commit -m "docs(wiki): sync wiki documentation from main repository [skip ci]"
              git push origin HEAD:master || git push origin HEAD:main
              echo "===> GitHub Wiki successfully updated!"
            fi
          else
            echo "::warning::GitHub Wiki repository is not yet initialized or accessible."
            echo "::notice::To initialize GitHub Wiki: Go to your repository on GitHub, click the 'Wiki' tab, and click 'Create the first page'. Once created, this workflow will automatically synchronize all wiki pages."
          fi
