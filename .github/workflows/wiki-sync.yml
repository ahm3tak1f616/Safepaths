name: Sync Wiki
on:
  push:
    branches: [main]
    paths:
      - wiki/**
      - .github/workflows/wiki-sync.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: github-wiki
  cancel-in-progress: false
jobs:
  sync-wiki:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Deploy Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          gh auth setup-git
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" wiki_clone
          for page in wiki/*.md; do
            if [ "$(basename "$page")" != 'README.md' ]; then
              cp "$page" wiki_clone/
            fi
          done
          cd wiki_clone
          git rm --ignore-unmatch README.md
          git add -- '*.md'
          if ! git diff --cached --quiet; then
            git commit -m 'docs(wiki): update shared edition documentation [skip ci]'
            git push origin HEAD
          fi
