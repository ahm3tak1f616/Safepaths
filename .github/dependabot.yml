version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gradle
    directories:
      - /forge-1.20.1
      - /neoforge-1.21.1
    schedule:
      interval: weekly
    # Loader upgrades stay manual; security update pull requests remain enabled.
    open-pull-requests-limit: 0
