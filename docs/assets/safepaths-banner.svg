<text x="60" y="169" fill="#f5f3df" font-size="76" font-weight="750" letter-spacing="-2">Paths form</text>
<text x="60" y="251" fill="#f5f3df" font-size="76" font-weight="750" letter-spacing="-2">where you walk.</text>
<text x="64" y="311" fill="#c4d4b7" font-size="22">Walk a route. Make a trail. Find your way home.</text>
<rect x="64" y="356" width="48" height="4" rx="2" fill="#d6b16f"/>
<text x="64" y="409" fill="#9ab795" font-size="16" font-weight="600" letter-spacing="1.5">MINECRAFT · FORGE + NEOFORGE</text>
