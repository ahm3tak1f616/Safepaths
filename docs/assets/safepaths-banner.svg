<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-labelledby="title desc">
<title id="title">Safepaths — Paths form where you walk</title>
<desc id="desc">A golden winding trail crosses a grassy island toward a quiet timber-framed settlement. The settlement is a subtle nod to optional MineColonies support.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d211c"/><stop offset=".6" stop-color="#17362a"/><stop offset="1" stop-color="#31543a"/></linearGradient>
