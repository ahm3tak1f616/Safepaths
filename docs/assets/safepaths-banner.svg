<linearGradient id="trail" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dfc28a"/><stop offset="1" stop-color="#b8965b"/></linearGradient>
<radialGradient id="air"><stop stop-color="#a5be7b" stop-opacity=".16"/><stop offset="1" stop-color="#a5be7b" stop-opacity="0"/></radialGradient>
